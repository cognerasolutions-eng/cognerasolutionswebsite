<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Cognera Solutions</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for professional look and feel */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb; /* Light background for contrast */
        }
        .form-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: white;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 0px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .input-field, .textarea-field, .select-field {
            transition: all 0.2s ease-in-out;
        }
        .input-field:focus, .textarea-field:focus, .select-field:focus {
            border-color: #3b82f6; /* Blue border on focus */
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }
        .message-box {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.5s, transform 0.5s;
            transform: translateY(-50px);
        }
        .message-box.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Notification Message Box -->
    <div id="message-box" class="message-box p-4 rounded-lg bg-green-500 text-white shadow-xl max-w-sm">
        <p id="message-text"></p>
    </div>

    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="form-container rounded-xl w-full">
            <header class="text-center mb-8">
                <h1 class="text-3xl font-extrabold text-gray-800">Inquire About Our Services</h1>
                <p class="text-gray-500 mt-2">Let's discuss how Cognera Solutions can empower your business.</p>
            </header>

            <form id="contactForm" class="space-y-6">
                <!-- Name and Email Group -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input type="text" id="name" name="name" required
                               class="input-field w-full px-4 py-2 border border-gray-300 rounded-lg text-gray-900"
                               placeholder="John Doe">
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Work Email</label>
                        <input type="email" id="email" name="email" required
                               class="input-field w-full px-4 py-2 border border-gray-300 rounded-lg text-gray-900"
                               placeholder="john.doe@company.com">
                    </div>
                </div>

                <!-- Company and Service Group -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="company" class="block text-sm font-medium text-gray-700 mb-1">Company Name</label>
                        <input type="text" id="company" name="company" required
                               class="input-field w-full px-4 py-2 border border-gray-300 rounded-lg text-gray-900"
                               placeholder="Acme Corp">
                    </div>
                    <div>
                        <label for="service" class="block text-sm font-medium text-gray-700 mb-1">Service of Interest</label>
                        <select id="service" name="service" required
                                class="select-field w-full px-4 py-2 border border-gray-300 rounded-lg text-gray-900 bg-white">
                            <option value="">Select a Service</option>
                            <option value="BPO-Support">BPO Services (Customer Support, Telecalling)</option>
                            <option value="KPO-Data">KPO Services (Data Analytics, Research)</option>
                            <option value="Hybrid-Model">Hybrid/Custom Outsourcing</option>
                            <option value="General-Inquiry">General Inquiry</option>
                        </select>
                    </div>
                </div>

                <!-- Message Field -->
                <div>
                    <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Your Message / Requirements</label>
                    <textarea id="message" name="message" rows="4" required
                              class="textarea-field w-full px-4 py-2 border border-gray-300 rounded-lg text-gray-900"
                              placeholder="Tell us about your outsourcing needs..."></textarea>
                </div>

                <!-- Submit Button -->
                <div>
                    <button type="submit"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                        Send Inquiry
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Function to display a temporary, non-blocking message box
        function showMessage(text, isError = false) {
            const box = document.getElementById('message-box');
            const textElement = document.getElementById('message-text');
            textElement.textContent = text;

            // Update styling based on success/error
            if (isError) {
                box.classList.remove('bg-green-500');
                box.classList.add('bg-red-500');
            } else {
                box.classList.remove('bg-red-500');
                box.classList.add('bg-green-500');
            }

            // Show the box
            box.classList.add('show');

            // Hide the box after 5 seconds
            setTimeout(() => {
                box.classList.remove('show');
            }, 5000);
        }

        document.getElementById('contactForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent default form submission

            const form = event.target;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            // ----------------------------------------------------------------
            // !!! IMPORTANT: SERVER-SIDE INTEGRATION REQUIRED !!!
            // ----------------------------------------------------------------
            // For security, actual email sending MUST be handled by a secure 
            // backend service (e.g., a serverless function, an API route, 
            // or an email API like SendGrid, Resend, or Mailgun).
            //
            // The client-side (this code) just sends the data to that service.
            // Replace '/api/send-email' with your actual server endpoint.

            const API_ENDPOINT = '/api/send-email'; 

            // Simulate the submission process with a loading indicator (optional)
            const submitButton = form.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            submitButton.textContent = 'Sending...';

            // We will use a placeholder fetch and simulate success/failure
            fetch(API_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                // Send the collected form data as JSON
                body: JSON.stringify(data),
            })
            .then(response => {
                // In a real application, you would check response.ok
                // if (response.ok) { ... } else { ... }
                
                // --- MOCK RESPONSE START ---
                // Simulating a successful response after a short delay
                return new Promise(resolve => setTimeout(() => resolve({ status: 200, json: () => ({ message: "Inquiry received." }) }), 1500));
                // --- MOCK RESPONSE END ---
            })
            .then(result => {
                // Show success message
                showMessage('Success! Your inquiry has been sent to Cognera Solutions. We will contact you shortly.', false);
                // Optionally reset the form fields
                form.reset();
            })
            .catch(error => {
                console.error('Submission Error:', error);
                // Show error message
                showMessage('Error sending inquiry. Please try again or email us directly.', true);
            })
            .finally(() => {
                // Re-enable the button and restore text
                submitButton.disabled = false;
                submitButton.textContent = 'Send Inquiry';
            });

        });
    </script>

</body>
</html>
