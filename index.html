    <!-- Configure Tailwind to use Urbanist font and custom colors -->

    <!-- Custom CSS for glass/glow effects not easily done in Tailwind -->
    <style>
        .glass-border {
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
        }
        .text-gradient {
            background-image: linear-gradient(to right, #F8FAFC, #94A3B8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .timeline-line {
            content: '';
            position: absolute;
            width: 2px;
            background-color: rgba(255, 255, 255, 0.1);
            top: 0;
            bottom: 0;
            left: 50%;
            margin-left: -1px;
        }
        @media (max-width: 900px) {
            .timeline-line {
                left: 31px;
            }
        }
    </style>
</head>
